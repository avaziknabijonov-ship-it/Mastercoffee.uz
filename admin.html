<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Master Coffee</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:#f6f1ec;color:#2a1a10}
header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.2rem;background:#1e1008;color:#fff}
header img{height:30px}header .sp{flex:1}
button,.btn{font:inherit;border:0;border-radius:8px;padding:.5rem .9rem;background:#8a4b25;color:#fff;cursor:pointer}
button.ghost{background:#e9ddd2;color:#2a1a10}button.danger{background:#b3261e}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:.45rem .6rem;border:1px solid #d8c8ba;border-radius:7px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.78rem;font-weight:600;color:#6b5546;margin:.55rem 0 .2rem}
.login{max-width:340px;margin:12vh auto;background:#fff;padding:1.6rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.wrap{display:grid;grid-template-columns:320px 1fr;gap:1rem;padding:1rem;max-width:1300px;margin:auto}
.panel{background:#fff;border-radius:12px;padding:1rem;box-shadow:0 4px 16px rgba(40,24,14,.06)}
.list{max-height:calc(100vh - 210px);overflow:auto;margin-top:.6rem}
.item{display:flex;gap:.6rem;align-items:center;padding:.45rem;border-radius:8px;cursor:pointer}
.item:hover{background:#f6efe8}.item.on{background:#f0e1d3}
.item img{width:44px;height:44px;object-fit:cover;border-radius:6px;background:#eee}
.item small{color:#8b7363;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.imgs{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.3rem}
.imgs div{position:relative}.imgs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.imgs button{position:absolute;top:2px;right:2px;padding:0 .4rem;background:#b3261e}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.msg{margin-left:.5rem;font-weight:600}.ok{color:#2f7a44}.err{color:#b3261e}
.tabs button{background:transparent;color:#e8d5c4}.tabs button.on{background:#8a4b25;color:#fff}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:.45rem;text-align:left;vertical-align:top}
.hint{font-size:.78rem;color:#8b7363}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <img src="/assets/logo-dark.png" alt="Master Coffee" style="height:40px">
  <h2>Admin panel</h2>
  <form id="loginForm">
    <label>Parol</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="bar"><button>Kirish</button><span id="loginMsg" class="msg err"></span></div>
  </form>
</div>

<div id="appView" hidden>
  <header>
    <img src="/assets/logo.png" alt="Master Coffee">
    <nav class="tabs"><button data-tab="products" class="on">Mahsulotlar</button><button data-tab="leads">Arizalar</button></nav>
    <span class="sp"></span>
    <a href="/" target="_blank" style="color:#e8b98a">Saytni ochish ↗</a>
    <button class="ghost" id="logout">Chiqish</button>
  </header>

  <div id="productsTab" class="wrap">
    <div class="panel">
      <div style="display:flex;gap:.5rem"><input id="q" placeholder="Qidirish..."><button id="addBtn">+ Yangi</button></div>
      <div class="list" id="list"></div>
      <div class="bar"><button id="saveAll">Saytga saqlash</button><span id="saveMsg" class="msg"></span></div>
      <p class="hint">O'zgarishlar "Saytga saqlash" bosilgandan keyin saytda ko'rinadi.</p>
    </div>
    <div class="panel" id="editor"><p class="hint">Chapdan mahsulot tanlang yoki "+ Yangi" bosing.</p></div>
  </div>

  <div id="leadsTab" class="wrap" hidden style="grid-template-columns:1fr">
    <div class="panel"><table><thead><tr><th>Ism</th><th>Telefon</th><th>Mavzu</th><th>Izoh / savat</th></tr></thead><tbody id="leads"></tbody></table></div>
  </div>
</div>
<script src="/admin.js"></script>
</body>
</html>
